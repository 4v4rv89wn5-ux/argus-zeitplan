<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ARGUS Zeitplan 26/27</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=d58c8d91">
<link rel="shortcut icon" href="favicon-32.png?v=d58c8d91">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=d58c8d91">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Missionsfahrplan – Kopf mit Countdown, Gantt-Überblick über 21 Kalenderwochen, Meilensteine, kritischer Pfad, Wochenkarten mit aufklappbaren Aufgaben und Filter nach Bereich oder Person. Farben aus dem ARGUS-Corporate-Design. */
:root{
  --bg:#F1EFE8; --surface:#FBFAF6; --ink:#1E1A44; --muted:#5D5978; --line:#D8D4DE;
  --indigo:#26215C; --indigo-soft:rgba(38,33,92,.08);
  --teal:#0F6E56; --teal-soft:rgba(15,110,86,.13);
  --coral:#C9502A; --coral-soft:rgba(216,90,48,.13);
  --gold:#A87A12; --gold-soft:rgba(216,165,49,.2);
  --blue:#3F7FBC; --blue-soft:rgba(92,155,213,.18);
  --on-indigo:#F1EFE8; --shadow:rgba(30,26,68,.18);
  --f-display:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121029; --surface:#1B1840; --ink:#ECE9F5; --muted:#A6A2C4; --line:#312D5E;
  --indigo:#9C94EC; --indigo-soft:rgba(156,148,236,.14);
  --teal:#45C39C; --teal-soft:rgba(69,195,156,.16);
  --coral:#F2805A; --coral-soft:rgba(242,128,90,.17);
  --gold:#E7BC52; --gold-soft:rgba(231,188,82,.17);
  --blue:#82B6E8; --blue-soft:rgba(130,182,232,.17);
  --on-indigo:#121029; --shadow:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121029; --surface:#1B1840; --ink:#ECE9F5; --muted:#A6A2C4; --line:#312D5E;
  --indigo:#9C94EC; --indigo-soft:rgba(156,148,236,.14);
  --teal:#45C39C; --teal-soft:rgba(69,195,156,.16);
  --coral:#F2805A; --coral-soft:rgba(242,128,90,.17);
  --gold:#E7BC52; --gold-soft:rgba(231,188,82,.17);
  --blue:#82B6E8; --blue-soft:rgba(130,182,232,.17);
  --on-indigo:#121029; --shadow:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-size:1.25rem;font-weight:600;letter-spacing:-.005em}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.lede{max-width:66ch;color:var(--muted)}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;flex-direction:column;gap:6px}

header{display:flex;flex-direction:column;gap:18px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:clamp(2.1rem,6vw,3.4rem);letter-spacing:.12em;line-height:1;color:var(--indigo)}
.title-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.title-row h1{font-size:clamp(1.35rem,3vw,1.8rem);font-weight:600;margin-top:10px}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
.status b{color:var(--coral);font-weight:500}
.countdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cd .n{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.cd .l{font-size:.86rem;color:var(--muted)}
.cd.bremen .n{color:var(--indigo)}
.cd.frist .n{color:var(--coral)}
.cd.intern .n{color:var(--teal)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gantt{display:grid;grid-template-columns:9.5rem repeat(21,minmax(2.5rem,1fr));min-width:63rem;font-size:.78rem;position:relative}
.g-lab{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 10px;font-weight:600;font-size:.78rem;display:flex;flex-direction:column;justify-content:center;line-height:1.2;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.g-lab small{font-weight:400;color:var(--muted);font-size:.7rem}
.g-kw{font-family:var(--f-mono);text-align:center;padding:8px 0 6px;color:var(--muted);line-height:1.25;border-left:1px solid var(--line)}
.g-kw b{display:block;color:var(--ink);font-weight:500}
.g-kw.now{background:var(--indigo);color:var(--on-indigo)}
.g-kw.now b{color:var(--on-indigo)}
.g-row-bg{grid-column:2 / -1;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(21,1fr);min-height:30px}
.bar{align-self:center;margin:4px 3px;border-radius:5px;padding:3px 5px;font-size:.7rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;z-index:1}
.bar.ferien{background:var(--teal-soft);color:var(--teal);border:1px dashed var(--teal)}
.bar.phase{background:var(--indigo-soft);color:var(--indigo);border:1px solid var(--indigo);font-family:var(--f-mono);font-weight:500}
.bar.ws{background:var(--blue-soft);color:var(--ink);border-left:3px solid var(--blue)}
.bar.test{background:var(--gold-soft);color:var(--ink);border-left:3px solid var(--gold)}
.bar.rep{background:var(--indigo-soft);color:var(--ink);border-left:3px solid var(--indigo)}
.bar.pending{background:transparent;color:var(--muted);border:1px dashed var(--line);font-style:italic;font-weight:400;text-align:center}
.mark{align-self:stretch;justify-self:stretch;display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;padding:4px 0;z-index:1;border-radius:4px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.dot.haar{background:var(--blue)}
.dia{width:11px;height:11px;transform:rotate(45deg);background:var(--teal)}
.flag{width:11px;height:11px;background:var(--coral);clip-path:polygon(0 0,100% 50%,0 100%)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:11px;border-radius:3px;display:inline-block}

.ms-table{width:100%;border-collapse:collapse;min-width:640px;font-size:.92rem}
.ms-table th{text-align:left;font-weight:500;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.ms-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.ms-table tr:last-child td{border-bottom:0}
.ms-table td.d{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms-table td.int{color:var(--teal);font-weight:500}
.ms-table td.off{color:var(--coral)}
.ms-table .ph{font-family:var(--f-mono);font-size:.76rem;color:var(--indigo);white-space:nowrap}
.ms-table tr.past{opacity:.5}

.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;flex:1 1 140px;display:flex;flex-direction:column;gap:3px}
.link .w{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.link .t{font-weight:600;font-size:.88rem;line-height:1.3}
.link.hot{border-color:var(--coral);box-shadow:inset 3px 0 0 var(--coral)}
.arrow{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.note{font-size:.88rem;color:var(--muted);max-width:72ch}
.note b{color:var(--ink);font-weight:600}

/* Bereiche */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.area .an{font-weight:600;font-size:.9rem}
.area .am{display:flex;flex-wrap:wrap;gap:6px;font-size:.84rem;color:var(--muted)}
.area .am span{display:inline-flex;align-items:center;gap:5px}

/* Filter */
.filters{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow .fl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:4.6rem;flex:none}
.frow button,.toggle{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.frow button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.toggle{border-radius:6px;font-size:.82rem;align-self:flex-start}
button:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Wochen */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.week.now{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo)}
.week.ferien{background:linear-gradient(var(--teal-soft),var(--teal-soft)),var(--surface)}
.wk-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wk-num{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;color:var(--indigo)}
.wk-date{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-tag{font-size:.78rem;font-weight:600;color:var(--teal)}
.wk-now{font-family:var(--f-mono);font-size:.7rem;background:var(--indigo);color:var(--on-indigo);padding:2px 7px;border-radius:4px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.74rem;padding:3px 8px;border-radius:5px;line-height:1.35;font-variant-numeric:tabular-nums}
.chip.exam{background:var(--gold-soft);color:var(--ink)}
.chip.exam b{font-weight:600}
.chip.exam.haar{background:var(--blue-soft)}
.chip.hol{background:var(--teal-soft);color:var(--teal)}
.chip.off{background:var(--coral-soft);color:var(--coral);font-weight:600}
.ms{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:7px;background:var(--teal-soft);font-size:.86rem;font-weight:600;color:var(--ink)}
.ms .dia{margin-top:5px;flex:none}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.task summary{list-style:none;cursor:pointer;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.task summary::-webkit-details-marker{display:none}
.task .ttl{font-size:.9rem;line-height:1.4;font-weight:500;display:flex;gap:8px;align-items:flex-start}
.task .ttl::before{content:"";flex:none;width:0;height:0;margin-top:6px;border-left:6px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.task[open] .ttl::before{transform:rotate(90deg)}
.task .meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-left:14px}
.atag{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;line-height:1.4}
.who{display:inline-flex;gap:3px}
.who i{font-style:normal;font-family:var(--f-mono);font-size:.66rem;font-weight:500;min-width:24px;height:18px;padding:0 4px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.desc{padding:2px 12px 12px 24px;display:flex;flex-direction:column;gap:8px;font-size:.88rem;line-height:1.5}
.desc ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.desc .done{border-top:1px dashed var(--line);padding-top:8px;color:var(--ink)}
.desc .done b{color:var(--teal);font-weight:600}
.empty{font-size:.86rem;color:var(--muted);font-style:italic}
.week.dim{opacity:.55}

.assume{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.as{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.as b{font-weight:600}
.as.q{border-top-color:var(--gold)}

/* Hover-Details */
[data-tip]{cursor:pointer}
.bar[data-tip]:hover,.bar[data-tip]:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
.mark:hover,.mark:focus-visible{background:var(--indigo-soft);outline:none}
.g-kw[data-tip]:hover,.g-kw[data-tip]:focus-visible{background:var(--indigo-soft);outline:none}
.g-kw.now[data-tip]:hover,.g-kw.now[data-tip]:focus-visible{background:var(--indigo)}
.tip{position:fixed;z-index:60;left:0;top:0;width:max-content;max-width:min(380px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px var(--shadow);padding:11px 13px;font-size:.82rem;line-height:1.45;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.tip.pinned{pointer-events:auto}
.tip-h{display:flex;flex-direction:column;gap:1px}
.tip-h b{font-weight:600;font-size:.9rem}
.tip-h span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tip-d{color:var(--muted)}
.tip-l{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tip-sec{display:flex;flex-direction:column;gap:3px}
.tip-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.tip-sec.off li{color:var(--coral);font-weight:600}
.tip-sec.ms li{color:var(--teal);font-weight:600}
.tip-sec.hol li{color:var(--teal)}
.tip-sec.plain li{color:var(--muted)}
.tip-sec.exam li::before,.tip-sec.haar li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}
.tip-sec.haar li::before{background:var(--blue)}
.tip-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start}
.tip-list.nokw li{grid-template-columns:minmax(0,1fr) auto}
.tip-kw{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);padding-top:1px;white-space:nowrap}
.tip-more,.tip-hint,.tip-empty{font-size:.74rem;color:var(--muted)}
.tip-hint{border-top:1px dashed var(--line);padding-top:6px}
.tip-go{font:inherit;font-size:.8rem;align-self:flex-start;border:1px solid var(--indigo);background:var(--indigo);color:var(--on-indigo);border-radius:6px;padding:5px 10px;cursor:pointer}
.week.flash{box-shadow:0 0 0 3px var(--teal)}
footer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
@media (max-width:520px){.weeks{grid-template-columns:1fr}.cd .n{font-size:1.35rem}.frow .fl{width:100%}}
@media (prefers-reduced-motion:no-preference){.frow button,.week{transition:background .15s,opacity .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){.task .ttl::before{transition:none}}

/* Grundlagen für GitHub Pages (auf Claude ergänzt das Gerüst diese Regeln) */
body{margin:0}
[hidden]{display:none!important}
/* Passwort-Tor */
.gate{min-height:70vh;display:flex;align-items:center;justify-content:center}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.gate-card .brand{font-size:2rem}
.gate-card p{color:var(--muted);font-size:.92rem}
.gate-card label{font-size:.85rem;font-weight:600}
.gate-card input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.gate-card .rm{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
.gate-card button{font:inherit;font-weight:600;background:var(--indigo);color:var(--on-indigo);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.gate-card button:disabled{opacity:.6;cursor:default}
.gate-card input:focus-visible,.gate-card button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.gate-msg{min-height:1.4em;font-size:.85rem;color:var(--coral)}
/* Status */
.st{font-size:.68rem;border-radius:4px;padding:1px 6px;line-height:1.5;font-weight:600;white-space:nowrap}
.st.done{background:var(--teal-soft);color:var(--teal)}
.st.late{background:var(--coral-soft);color:var(--coral)}
.st.due{color:var(--muted);border:1px solid var(--line);font-weight:500}
.st.moved{color:var(--gold);border:1px dashed var(--gold);font-weight:500}
.task.is-done .ttl{color:var(--muted)}
.task.is-late{border-color:var(--coral)}
.src-line{font-size:.78rem;color:var(--muted)}
.wk-prog{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:8px}
.cd.prog .n{color:var(--ink)}
/* Soll/Ist */
.ms-table td.ist-done{color:var(--teal);font-weight:600}
.ms-table td.ist-late{color:var(--coral);font-weight:600}
.ms-table td.ist-open{color:var(--muted)}
.dev{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.sub-h{font-size:1rem;font-weight:600;margin-top:6px}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 22px}
.pg{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:4px 10px;align-items:center;font-size:.85rem}
.pg .pb{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.pg .pb i{display:block;height:100%;background:var(--teal)}
.pg .pb i.late{background:var(--coral)}
.pg .pv{grid-column:2;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.istlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.istlog li{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:10px}
.istlog .dt{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.istlog .src{color:var(--muted);font-size:.78rem}
.vs{display:flex;flex-direction:column;gap:8px}
.nchip{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.notes{margin:.5rem 0;font-size:.86rem}.notes ul{margin:.25rem 0 0;padding-left:1.1rem}
.howto{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:.88rem}.howto ul{margin:.35rem 0 0;padding-left:1.1rem}.howto code{font-size:.82rem}
.v{border:1px dashed var(--gold);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.v .vm{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tip-st{display:inline-block;width:1em;font-weight:700}
.tip-st.done{color:var(--teal)}
.tip-st.late{color:var(--coral)}
/* Erweiterungen */
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.amp{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;flex:none}
.amp.g{background:var(--teal)}.amp.y{background:var(--gold)}.amp.r{background:var(--coral)}.amp.d{background:var(--line);box-shadow:inset 0 0 0 2px var(--muted)}
.vm{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.burn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.burn svg{width:100%;height:auto;display:block}
.search{display:flex;gap:10px;align-items:center}
.search .fl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:4.6rem;flex:none}
.search input{font:inherit;flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.qres:empty{display:none}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.blist a,.dep a,.ms-table a{color:var(--indigo);text-underline-offset:2px}
.bar.abw{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px);color:var(--ink);border:1px solid var(--line);font-family:var(--f-mono)}
.st.wait{color:var(--coral);border:1px dashed var(--coral);font-weight:500}
.st.abw{color:var(--muted);border:1px dashed var(--muted);font-weight:500}
.dep{font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.dep b{font-size:.74rem;font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
.task.flash{box-shadow:0 0 0 3px var(--teal)}
.pipe{display:inline-flex;gap:2px;vertical-align:middle}
.pipe i{width:10px;height:6px;border-radius:2px;background:var(--line)}
.pipe i.on{background:var(--teal)}
.ms-table tr.warn td{background:var(--coral-soft)}
.warnbox{margin-top:4px;padding:6px 10px;border-radius:6px;background:var(--coral-soft);font-size:.86rem}
.me-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.me-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.me-box.bad{border-color:var(--coral)}
#meWho button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
#meWho button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
#meWho .fl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:4.6rem;flex:none}
#bestTable{min-width:900px}#bestTable td.vm{min-width:240px}#testTable{min-width:760px}
#meBody>.frow{margin-top:12px}
.abo{display:flex;flex-direction:column;gap:10px;margin-top:14px}.abo-row{display:flex;flex-direction:column;gap:6px}
.abo-url{font:inherit;font-family:var(--f-mono);font-size:.74rem;flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
a.toggle{text-decoration:none}
.print-only{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .no-print,.gate,button,.toggle,.forget,.tip,#printNote,.countdown{display:none!important}
  .print-only{display:block!important}
  .amp,.pipe i,.st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{gap:18px;max-width:none}
  section{break-inside:auto}
  .month{break-before:page}
  .month:first-of-type{break-before:auto}
  .ms-table{min-width:0;font-size:9.5pt}
  .scroll{overflow:visible;border:0}
  a{color:inherit;text-decoration:none}
}
.forget{font:inherit;font-size:.78rem;background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:4px 10px;cursor:pointer;align-self:flex-start}
</style>

      var h='<div class="me-grid">';
      h+='<div class="me-box'+(late.length?' bad':'')+'"><span class="eyebrow">Überfällig</span>'+(late.length?'<ul class="blist">'+late.map(li).join("")+'</ul>':'<p class="empty">Nichts – sehr gut.</p>')+'</div>';
      h+='<div class="me-box"><span class="eyebrow">Nächste 7 Tage</span>'+(soon.length?'<ul class="blist">'+soon.map(li).join("")+'</ul>':'<p class="empty">Nichts fällig.</p>')+'</div>';
      var ex=examsSoon();
      if(ex.length||ab.length){h+='<div class="me-box"><span class="eyebrow">Sonst noch</span><ul class="blist">'+ex.map(function(x){return '<li>Prüfung: '+esc(x)+'</li>';}).join("")+ab.map(function(a){return '<li>Abwesend '+fmtD(pd(a.von))+(a.bis!==a.von?' – '+fmtD(pd(a.bis)):'')+'</li>';}).join("")+'</ul></div>';}
      h+='</div>'+aboHtml();
      body.innerHTML=h;
      body.querySelectorAll(T[194]).forEach(function(btn){btn.addEventListener("click",function(){
        var inp=document.getElementById(btn.getAttribute("data-copy"));inp.focus();inp.select();
        var ok=false;try{ok=document.execCommand("copy");}catch(e){}
        if(!ok&&navigator.clipboard){navigator.clipboard.writeText(inp.value).then(function(){btn.textContent=T[195];},function(){btn.textContent=T[196];});return;}
        btn.textContent=ok?T[197]:T[198];
      });});
    }
    who.addEventListener("click",function(e){var b=e.target.closest(T[199]);if(!b){return;}var p=b.getAttribute("data-me");ich=(ich===p)?null:p;try{if(ich){localStorage.setItem("argus-ich",ich);}else{localStorage.removeItem("argus-ich");}}catch(x){}draw();});
    draw();
  })();

  /* ---- Druckansicht: Monatsübersicht ---- */
  (function(){
    var el=document.getElementById("monate");if(!el){return;}
    var MON=[T[200],T[201],T[202],T[203],"Mai",T[204],T[205],T[206],T[207],T[208],T[209],T[210]],by={},order=[];
    ALLTASKS.slice().sort(function(a,b){return a.due<b.due?-1:(a.due>b.due?1:0);}).forEach(function(t){var k=t.due.slice(0,7);if(!by[k]){by[k]=[];order.push(k);}by[k].push(t);});
    el.innerHTML='<h2>Monatsübersicht</h2>'+order.map(function(k){var y=+k.slice(0,4),m=+k.slice(5,7);
      return '<div class="month"><h3>'+MON[m-1]+' '+y+'</h3><table class="ms-table"><thead><tr><th>Fällig</th><th>Aufgabe</th><th>Bereich</th><th>ID</th><th>Status</th></tr></thead><tbody>'+by[k].map(function(t){var s=tstate(t);
        return '<tr><td class="d">'+fmtD(pd(t.due))+'</td><td>'+esc(t.t)+'</td><td>'+t.b.map(function(a){return a===T[211]?T[212]:esc(AREAS[a].n);}).join(", ")+'</td><td class="d">'+esc(t.id)+'</td><td>'+(s==="done"?"✓":(s==="late"?T[213]:"☐"))+'</td></tr>';}).join("")+'</tbody></table></div>';}).join("");
    var pb=document.getElementById(T[214]),pn=document.getElementById(T[215]);
    if(pb){pb.addEventListener("click",function(){
      if(onClaude()){pn.innerHTML='Auf der Claude-Seite ist Drucken gesperrt. Öffne die GitHub-Fassung'+(P.pages_url?' (<a href="'+esc(P.pages_url)+'" target="_blank" rel="noopener">'+esc(P.pages_url)+'</a>)':'')+' und drück dort „Drucken / PDF“ – oder ⌘P. Gedruckt wird eine Monatsübersicht statt der Wochenkarten.';pn.hidden=false;return;}
      window.print();
    });}
  })();

  var fg=document.getElementById("forget");
  if(window.__ARGUS_ENC&&fg){fg.hidden=false;fg.addEventListener("click",function(){try{localStorage.removeItem("argus-zeitplan-key");}catch(e){}fg.textContent=T[216];fg.disabled=true;});}
}

/* Passwort-Tor */
(function(){
  "use strict";
  var PL=JSON.parse(document.getElementById("payload").textContent);
  var KEYNAME="argus-zeitplan-key";
  function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++){u[i]=b.charCodeAt(i);}return u;}
  function b64e(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++){s+=String.fromCharCode(u[i]);}return btoa(s);}
  function start(data){document.getElementById("gate").hidden=true;var app=document.getElementById("app");app.innerHTML=data.html;app.hidden=false;window.PLAN=data.plan;window.TEXTE=data.texte||[];render();}
  if(PL.mode!=="enc"){start(PL.data);return;}
  window.__ARGUS_ENC=true;
  var gate=document.getElementById("gate"),msg=document.getElementById("gate-msg"),btn=document.getElementById("gate-btn");
  gate.hidden=false;
  if(!(window.crypto&&crypto.subtle)){msg.textContent="Dieser Browser kann die Seite nicht entschlüsseln. Öffne sie in einem aktuellen Browser.";btn.disabled=true;return;}
  function tryKey(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(PL.iv)},key,b64d(PL.ct)).then(function(pt){return JSON.parse(new TextDecoder().decode(pt));});}
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEYNAME)||"null");}catch(e){}
  if(saved&&saved.salt===PL.salt&&saved.k){
    msg.textContent="Öffne mit dem gespeicherten Passwort …";
    crypto.subtle.importKey("raw",b64d(saved.k),{name:"AES-GCM"},true,["decrypt"]).then(tryKey).then(start).catch(function(){try{localStorage.removeItem(KEYNAME);}catch(e){}msg.textContent="Das gespeicherte Passwort passt nicht mehr. Bitte neu eingeben.";});
  }
  document.getElementById("gate-form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var pw=document.getElementById("gate-pw").value.replace(/\s+/g,"");
    if(!pw){msg.textContent="Bitte das Team-Passwort eingeben.";return;}
    msg.textContent="Entschlüssele …";btn.disabled=true;
    var stage="key";
    function why(err){return (err&&(err.name||"")+(err.message?": "+err.message:""))||String(err);}
    crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(PL.salt),iterations:PL.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    }).then(function(key){
      stage="decrypt";
      return tryKey(key).then(function(data){
        stage="show";
        if(document.getElementById("gate-remember").checked){crypto.subtle.exportKey("raw",key).then(function(raw){try{localStorage.setItem(KEYNAME,JSON.stringify({salt:PL.salt,k:b64e(raw)}));}catch(e){}}).catch(function(){});}
        start(data);
      });
    }).catch(function(err){
      btn.disabled=false;
      if(stage==="decrypt"){msg.textContent="Das Passwort stimmt nicht ("+pw.length+" Zeichen eingegeben). Versuch es noch einmal.";}
      else if(stage==="show"){msg.textContent="Entschlüsselt, aber die Seite ließ sich nicht anzeigen – "+why(err);}
      else{msg.textContent="Dein Browser konnte den Schlüssel nicht erzeugen – "+why(err);}
    });
  });
})();
